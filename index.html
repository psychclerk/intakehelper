<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clinical Intake</title>
<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background:#f7f9fc; margin:0; padding:0;
}
.container {
  max-width:720px; margin:40px auto; background:white;
  padding:32px; border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}
h1{margin-top:0;font-size:28px;}
h2{margin-top:32px;font-size:20px;border-bottom:1px solid #eee;padding-bottom:8px;}
label{font-weight:500; display:block; margin-top:16px;}
input, select, textarea {
  width:100%; padding:10px; margin-top:6px;
  border-radius:6px; border:1px solid #ccc; font-size:14px;
}
textarea{resize:vertical; min-height:60px;}
.suggestions{
  margin-top:8px; max-height:260px; overflow-y:auto;
  border:1px solid #ddd; border-radius:6px;
}
.suggestion{
  padding:8px 12px; cursor:pointer; border-bottom:1px solid #eee;
}
.suggestion:hover{background:#eef3ff;}
.tag{
  display:flex; justify-content:space-between;
  background:#eef3ff; padding:8px 12px;
  border-radius:20px; margin-top:8px; align-items:center;
}
.remove{cursor:pointer;font-weight:bold;margin-left:12px;color:#555;}
button{
  margin-top:16px; padding:12px; width:100%;
  background:#2f6fed; color:white; border:none;
  border-radius:8px; font-size:16px; cursor:pointer;
}
button:hover{background:#245bd8;}
pre{
  background:#111;color:#0f0;padding:16px;
  border-radius:8px;overflow-x:auto;margin-top:16px;
  font-size:13px;
}
.inline{display:flex;gap:8px;}
.inline button{width:auto;}
</style>
</head>
<body>

<div class="container">
<h1>Patient Intake</h1>

<h2>Patient Details</h2>
<label>Sex</label>
<select id="sex">
  <option value="female">Female</option>
  <option value="male">Male</option>
  <option value="other">Other</option>
</select>

<label>Age</label>
<input type="number" id="age" min="0" max="120"/>

<h2>Chief Complaint</h2>
<textarea id="chiefComplaint" placeholder="e.g. severe headache for 2 days"></textarea>

<h2>Symptoms</h2>
<input id="searchSymptom" placeholder="Search symptoms"/>
<div class="suggestions" id="suggestionsSymptom"></div>

<label>Add custom symptom</label>
<div class="inline">
  <input id="customSymptom"/>
  <button type="button" onclick="addCustomSymptom()">Add</button>
</div>

<div id="selectedSymptoms"></div>

<h2>Risk Factors</h2>
<input id="searchRisk" placeholder="Search risk factors"/>
<div class="suggestions" id="suggestionsRisk"></div>

<label>Add custom risk factor</label>
<div class="inline">
  <input id="customRisk"/>
  <button type="button" onclick="addCustomRisk()">Add</button>
</div>

<div id="selectedRisk"></div>

<h2>Chronic / Existing Conditions</h2>
<input id="searchCond" placeholder="Search conditions"/>
<div class="suggestions" id="suggestionsCond"></div>

<label>Add custom condition</label>
<div class="inline">
  <input id="customCond"/>
  <button type="button" onclick="addCustomCond()">Add</button>
</div>

<div id="selectedCond"></div>

<button onclick="generateSummary()">Generate Summary</button>
<pre id="output"></pre>

<h2>AI Differential Diagnosis</h2>
<label>OpenRouter API Key</label>
<input type="password" id="apiKey" placeholder="sk-or-..." />

<button onclick="sendSummaryToAI()">Generate Differential Diagnosis</button>
<pre id="aiResponse"></pre>
<button onclick="copyAIResponse()">Copy AI Response</button>

</div>

<script>
// ===== DATA =====
let symptoms=[], riskFactors=[], conditions=[];
let nameToId={}, riskNameToId={}, condNameToId={};
let selectedSymptoms=[], selectedRisk=[], selectedCond=[];

// ===== LOAD DATA =====
Promise.all([
  fetch("infermedica_symptoms.json").then(r=>r.json()),
  fetch("infermedica_risk_factors.json").then(r=>r.json()),
  fetch("infermedica_conditions.json").then(r=>r.json())
]).then(([s,r,c])=>{
  symptoms=s; riskFactors=r; conditions=c;
  s.forEach(i=>nameToId[i.name]=i.id);
  r.forEach(i=>riskNameToId[i.name]=i.id);
  c.forEach(i=>condNameToId[i.name]=i.id);

  setupSearch("searchSymptom","suggestionsSymptom",selectedSymptoms,nameToId,"selectedSymptoms");
  setupSearch("searchRisk","suggestionsRisk",selectedRisk,riskNameToId,"selectedRisk");
  setupSearch("searchCond","suggestionsCond",selectedCond,condNameToId,"selectedCond");
});

// ===== SEARCH =====
function setupSearch(inputId,suggId,array,map,container){
  const input=document.getElementById(inputId);
  const sugg=document.getElementById(suggId);
  input.oninput=()=>{
    const v=input.value.toLowerCase().trim();
    sugg.innerHTML="";
    if(!v) return;
    Object.keys(map).filter(n=>n.toLowerCase().includes(v))
    .forEach(name=>{
      if(array.includes(name)) return;
      const d=document.createElement("div");
      d.className="suggestion"; d.textContent=name;
      d.onclick=()=>{array.push(name); render(container,array);};
      sugg.appendChild(d);
    });
  };
}

// ===== CUSTOM ADDERS =====
function addCustomSymptom(){ addCustom("customSymptom",selectedSymptoms,"selectedSymptoms"); }
function addCustomRisk(){ addCustom("customRisk",selectedRisk,"selectedRisk"); }
function addCustomCond(){ addCustom("customCond",selectedCond,"selectedCond"); }

function addCustom(inputId,array,container){
  const v=document.getElementById(inputId).value.trim();
  if(!v) return;
  if(array.some(x=>x.toLowerCase()===v.toLowerCase())) return;
  array.push(v); render(container,array);
  document.getElementById(inputId).value="";
}

// ===== RENDER TAGS =====
function render(containerId,array){
  const c=document.getElementById(containerId);
  c.innerHTML="";
  array.forEach(n=>{
    const t=document.createElement("div");
    t.className="tag";
    t.innerHTML=`<span>${n}</span><span class="remove">✕</span>`;
    t.querySelector(".remove").onclick=()=>{
      array.splice(array.indexOf(n),1); render(containerId,array);
    };
    c.appendChild(t);
  });
}

// ===== SUMMARY =====
function generateSummary(){
  let s=`Patient Summary\n\nSex: ${sex.value}\nAge: ${age.value}\n\n`;
  if(chiefComplaint.value) s+=`Chief Complaint:\n${chiefComplaint.value}\n\n`;
  if(selectedSymptoms.length) s+=`Symptoms:\n- ${selectedSymptoms.join("\n- ")}\n\n`;
  if(selectedRisk.length) s+=`Risk Factors:\n- ${selectedRisk.join("\n- ")}\n\n`;
  if(selectedCond.length) s+=`Chronic Conditions:\n- ${selectedCond.join("\n- ")}\n`;
  output.textContent=s;
}

// ===== AI CALL =====
async function sendSummaryToAI(){
  const key=apiKey.value.trim();
  const note=output.textContent.trim();
  if(!key||!note){alert("Generate summary and enter API key.");return;}

  aiResponse.textContent="Loading response from AI...";

  const prompt=`Assume the role of a physician working in India.
Based on the following clinical note, generate a differential diagnosis as bullet points with justification next to each bullet.

${note}`;

  const body={
    model:"tngtech/deepseek-r1t-chimera:free",
    max_tokens:500,
    messages:[{role:"user",content:prompt}]
  };

  try{
    const res=await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":`Bearer ${key}`
      },
      body:JSON.stringify(body)
    });
    const json=await res.json();
    aiResponse.textContent=json.choices?.[0]?.message?.content || "No response.";
  }catch(e){
    aiResponse.textContent="Error: "+e.message;
  }
}

function copyAIResponse(){
  navigator.clipboard.writeText(aiResponse.textContent)
  .then(()=>alert("Copied to clipboard"));
}
</script>

</body>
</html>
